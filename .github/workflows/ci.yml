name: CI

# Implements all 5 steps declared in CLAUDE.md:
#   1. pnpm install --frozen-lockfile
#   2. Lint (eslint flat config)
#   3. TypeScript check (tsc --noEmit)
#   4. Unit tests (vitest)
#   5. Build (pnpm build)
#
# All steps must pass before merge. See wiki/decisions/ci-pipeline.md
# for why each step exists and what failure mode it protects against.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Catches the class of defect the whole test suite is blind to: code that
      # compiles, type-checks and passes its unit tests, and that no user can
      # reach. Five of those shipped on the compliance-vault branch before this
      # existed, each found by a person opening the running app.
      - name: Reachability
        run: pnpm check:reachability

      - name: Typecheck
        run: pnpm tsc:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Real-database tenant-isolation boundary tests. Separate job so the main
  # pipeline stays fast; spins up a throwaway Postgres, pushes the schema, and
  # runs the TENANT_IT-gated suite (skipped everywhere else).
  integration:
    name: Tenant isolation (real DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # pgvector image: the schema declares vector(1536) columns, so the
        # extension must exist for `drizzle-kit push` to create them.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: culinaire_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      APP_ENV: dev
      TENANT_IT: "1"
      # UOM_IT gates uomAndSelling.integration.test.ts — 31 tests over packaging
      # conversion, content equivalence and unit families. The flag was never set
      # anywhere, in CI or locally, so those tests had never executed. They pass.
      UOM_IT: "1"
      DATABASE_URL: postgresql://ci:ci@localhost:5432/culinaire_it
      DEV_DATABASE_URL: postgresql://ci:ci@localhost:5432/culinaire_it
      # Throwaway keys for this ephemeral, destroyed-after-the-run CI database
      # only — never the real dev/prod keys. organisation.tenant.integration.
      # test.ts is the first suite in this job to call createOrganisation()
      # (the service, not a raw insert), which encrypts org PII and throws if
      # these aren't set — every other tenant test seeds `organisation` rows
      # directly, bypassing PII encryption entirely.
      PII_ENCRYPTION_KEY: b5f9b9838d8ed457094872d51a841a91cf1d2be1a0dc5745fbf5d456cfa9fad7
      PII_HMAC_KEY: 240e45c0ca546021838cbd7ef3f6db89ae7db670a08bf2e74cdec5019e57657a
      CREDENTIALS_ENCRYPTION_KEY: c0dd5eaba08873f966f913dae031a0c95d492c58196e49097e18173fd58eaae4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @culinaire/shared resolves to ./dist; the server suite imports it, so it
      # must be built before vitest can resolve the package.
      - name: Build shared package
        run: pnpm --filter @culinaire/shared build

      - name: Enable pgvector extension
        run: PGPASSWORD=ci psql -h localhost -U ci -d culinaire_it -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Push schema to test database
        run: pnpm --filter @culinaire/server db:push

      # organisation.tenant.integration.test.ts is the first integration test
      # in this job to depend on seeded RBAC rows (it looks up the
      # "Operations Admin" role by name) — db:push only pushes schema, never
      # data, so without this step that suite's beforeAll throws.
      - name: Seed roles and permissions
        run: pnpm --filter @culinaire/server db:seed

      - name: Run tenant-isolation integration tests
        run: pnpm --filter @culinaire/server exec vitest run src/tenantIsolation.integration.test.ts

      # Storage areas + stock movements. The load-bearing assertion is that a
      # move NEVER changes stock_level — needs a real DB to be worth anything.
      - name: Run storage-area integration tests
        run: pnpm --filter @culinaire/server exec vitest run src/services/storageAreas.integration.test.ts

      # Compliance vault + daily-run-claim integration suites. vitest is invoked
      # here by explicit filename, not by glob/discovery — a new *.integration
      # test file is invisible to CI until it gets its own step below. If you're
      # adding one, copy this pattern; don't assume it'll be picked up.
      - name: Run compliance tenant-isolation integration tests
        run: pnpm --filter @culinaire/server exec vitest run src/services/compliance.tenant.integration.test.ts

      - name: Run roster tenant-isolation integration tests
        run: pnpm --filter @culinaire/server exec vitest run src/services/roster.tenant.integration.test.ts

      - name: Run organisation tenant-isolation integration tests
        run: pnpm --filter @culinaire/server exec vitest run src/services/organisation.tenant.integration.test.ts

      - name: Run compliance integration tests
        run: pnpm --filter @culinaire/server exec vitest run src/services/compliance.integration.test.ts

      - name: Run roster integration tests
        run: pnpm --filter @culinaire/server exec vitest run src/services/roster.integration.test.ts

      - name: Run public holiday integration tests
        run: pnpm --filter @culinaire/server exec vitest run src/services/publicHolidayService.integration.test.ts

      - name: Run workforce demand integration tests
        run: pnpm --filter @culinaire/server exec vitest run src/services/workforceDemand.integration.test.ts

      - name: Run staffing coverage integration tests
        run: pnpm --filter @culinaire/server exec vitest run src/services/staffingCoverage.integration.test.ts

      - name: Run shift swap integration tests
        run: pnpm --filter @culinaire/server exec vitest run src/services/shiftSwap.integration.test.ts

      - name: Run daily-run-claim integration tests
        run: pnpm --filter @culinaire/server exec vitest run src/utils/dailyRunClaim.integration.test.ts
