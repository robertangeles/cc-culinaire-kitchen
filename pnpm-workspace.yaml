packages:
  - "packages/*"
  - "mobile"

# One React for the whole hoisted tree. Expo SDK 58 pins react 19.3.0 exactly and
# react-native resolves the root `react`; a second copy (the web app was on 19.2.4)
# breaks the phone app at runtime. Bump these together with the Expo SDK.
overrides:
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0

# Allowlist of dependencies permitted to run install/build scripts.
# pnpm 10 blocks build scripts by default and reads this from here — the old
# home (the "pnpm" field in package.json) is no longer read.
onlyBuiltDependencies:
  - bcrypt
  - esbuild
  - tesseract.js
